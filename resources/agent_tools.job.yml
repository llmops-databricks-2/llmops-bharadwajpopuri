# Lecture 3: the agent's tools and memory, tested one layer at a time. Two serverless notebook
# tasks, one after the other (the gateway's rate limits):
#
#   agent_tools_check   every tool run directly, no model: search_papers on the Lakebase chunk table,
#                       resolve_therapy, the registry's argument gate, the Genie space through its
#                       managed MCP server (and through the SDK as a cross-check)
#   agent_experiments   the verification set V1–V8 through the agent, the fixed-RAG baseline, and
#                       session memory in Lakebase (continuity, a fresh session, another owner)
#
# The space ID is passed from the deployed resource, as the course's lecture3_tools.yml does, so no
# notebook carries a hard-coded ID. Same conventions as the other jobs: runs as the deployer,
# serverless environment 5, the course usage policy. Both notebooks also run locally (VS Code, OAuth)
# with GENIE_SPACE_ID set, which is how docs/agent_tools_log.md and docs/agent_log.md are written.
resources:
  jobs:
    agent_tools_check:
      name: job-agent-tools-check-bharadwajpopuri-${bundle.target}
      budget_policy_id: "${var.usage_policy_id}"
      max_concurrent_runs: 1
      parameters:
        - name: env
          default: ${bundle.target}
        - name: genie_space_id
          default: ${resources.genie_spaces.evidence-curator-space.id}
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ../dist/*.whl
      tasks:
        - task_key: agent_tools_check
          environment_key: default
          timeout_seconds: 1800
          notebook_task:
            notebook_path: ../notebooks/agent_tools_check.py
        - task_key: agent_experiments
          depends_on:
            - task_key: agent_tools_check
          environment_key: default
          timeout_seconds: 2400
          notebook_task:
            notebook_path: ../notebooks/agent_experiments.py
