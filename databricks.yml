# Databricks Asset Bundle of llmops-bharadwajpopuri, shaped like the course's llmops-course-code.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.

bundle:
  name: llmops-bharadwajpopuri
  # 1.20.0 is the first CLI that knows the genie_spaces resource (resources/genie_space.yml).
  databricks_cli_version: ">= 1.20.0"

# The course package is built as a wheel and installed in every job environment.
artifacts:
  default:
    type: whl
    build: uv build
    path: .

include:
  - resources/*.yml

# Values the Genie space and the lecture-3 job read from the bundle rather than from
# project_config.yml (a resource definition cannot load the YAML). Keep the two in step; the
# acc and prd targets override the catalog below.
variables:
  usage_policy_id:
    description: usage policy for serverless jobs (usage_policy_id in project_config.yml)
    default: 995f545e-7885-3c66-9825-046d051e0122
  warehouse_id:
    description: SQL warehouse of the Genie space (warehouse_id in project_config.yml)
    default: 65d92a5dcf046c9d
  catalog:
    description: Unity Catalog catalog of the trial tables (catalog in project_config.yml)
    default: llmops_dev
  schema:
    description: schema holding trials, trial_references and drug_aliases (schema in project_config.yml)
    default: bharadwajpopuri

# Three targets in the one course workspace, each writing your schema in its own catalog
# (project_config.yml). Each is deployed under the home folder of whoever deploys it: you from your
# laptop. A deployment workflow is introduced in a later lecture. The workspace host is
# set, so `databricks bundle validate -t dev` needs no profile to find it.
targets:
  # Your sandbox. Development mode prefixes every resource with "[dev" and the deployer's name,
  # so your own deploy and the pipeline's never collide.
  dev:
    default: true
    mode: development
    workspace:
      host: https://dbc-e81ca4d2-f6bd.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.target}/${bundle.name}

  # Acceptance: deployed on every merge to main.
  acc:
    variables:
      catalog: llmops_acc
    workspace:
      host: https://dbc-e81ca4d2-f6bd.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.target}/${bundle.name}

  # Production: deployed after acceptance, once you approve it.
  prd:
    variables:
      catalog: llmops_prd
    workspace:
      host: https://dbc-e81ca4d2-f6bd.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.target}/${bundle.name}
